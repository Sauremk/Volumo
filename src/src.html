<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Volumo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Volumo</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11; --card:#17191c; --card2:#1f2226; --line:#2a2e33;
  --txt:#f2f3f5; --mut:#8d939b; --acc:#c6f432; --acc-ink:#111; --mid:#e3a23b;
  --red:#ff5d5d; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Barlow',system-ui,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(180px + env(safe-area-inset-bottom))}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 20px}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
header.top h1{font-size:30px;font-weight:800;line-height:1;text-transform:uppercase}
header.top h1 span span{color:var(--acc)}header.top h1 .wm{color:var(--txt);white-space:nowrap}
header.top h1.brand{display:flex;align-items:center;gap:8px}header.top h1.brand svg{width:28px;height:28px;flex:none}
header.top small{color:var(--mut);font-size:14px}
.hbtns{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;font-weight:800;font-family:'Barlow Condensed';font-size:19px}
.iconbtn.av{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dotn{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:800 11px 'Barlow',sans-serif;display:grid;place-items:center;padding:0 4px}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}

/* cuerpo */
.stage{position:relative;background:radial-gradient(ellipse at 50% 45%,#1d2316,var(--card) 70%);border:1px solid var(--line);border-radius:22px;overflow:hidden}
#c3d{display:block;width:100%;height:440px;touch-action:pan-y;cursor:grab}
#c3d:active{cursor:grabbing}
#svg2d{display:none;width:100%;max-width:300px;height:auto;margin:10px auto 0}
.stage .lbl{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(14,15,17,.8);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.15s;pointer-events:none;white-space:nowrap}
.stage .lbl.on{opacity:1}
.stage .ctrl{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.stage .ctrl>*{pointer-events:auto}
.stage .seg{background:rgba(23,25,28,.9)}
.stage .hint{color:var(--mut);font-size:12px;text-align:right;max-width:120px;line-height:1.2}
.legend{display:flex;gap:14px;justify-content:center;margin:10px 0 4px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.weekgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.mrow b{flex:1;font-size:14px}
.mrow .pips{display:flex;gap:3px}
.mrow .pips i{width:8px;height:8px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}
.mrow .pips i.f{background:var(--acc);border-color:var(--acc)}
.mrow .pips i.p{background:var(--mid);border-color:var(--mid)}
.alert{display:flex;gap:12px;align-items:flex-start;background:#1f2614;border:1px solid #3a4a1a;border-radius:14px;padding:12px 14px;margin-bottom:10px;text-align:left;width:100%}
.alert .ic{font-size:20px;line-height:1}
.alert b{display:block;font-size:15px}
.alert span{color:var(--mut);font-size:13px}
.alert.warn{background:#2a1d14;border-color:#5a3a1a}

.search{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:14px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

.list{display:grid;gap:10px}
.ex{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%;cursor:pointer}
.sheet .ex{background:var(--card2)}
.ex .ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.sheet .ex .ic{background:var(--card)}
.ex .ic svg{width:26px;height:26px}
.ex .rk{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:800;font-size:20px;color:var(--mut)}
.ex .rk.g1{background:var(--acc);color:var(--acc-ink)}
.ex .rk.g2{background:#8faf24;color:var(--acc-ink)}
.ex .rk.g3{background:#5c7218;color:var(--txt)}
.ex .meta{flex:1;min-width:0}
.ex .meta b{display:block;font-size:16px;font-weight:700}
.ex .meta span{color:var(--mut);font-size:13px;line-height:1.3;display:block}
.add{flex:none;width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--acc)}
.sheet .add{background:var(--card)}
.add.in{background:var(--acc)!important;color:var(--acc-ink)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{font-size:21px;text-transform:uppercase}
.sec small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* entrenar: inicio */
.bigstart{display:flex;align-items:center;gap:14px;width:100%;background:var(--acc);color:var(--acc-ink);border-radius:18px;padding:18px;text-align:left}
.bigstart .pl{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.12);display:grid;place-items:center;font-size:20px}
.bigstart b{display:block;font-size:19px}
.bigstart span{font-size:14px;opacity:.75}
.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:8px}
.rrow .meta{flex:1;min-width:0}
.rrow .meta b{display:block;font-size:16px}
.rrow .meta span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .go{padding:9px 14px;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:14px}
.rrow .go.sec{background:var(--card2);color:var(--txt)}
.rrow .x{width:32px;height:32px;border-radius:8px;color:var(--mut);font-size:20px}
.muted{color:var(--mut);font-size:14px;line-height:1.4}

/* entrenar: activo */
.wkbar{position:sticky;top:0;z-index:15;background:rgba(14,15,17,.95);backdrop-filter:blur(10px);margin:0 -16px 12px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.wkbar .r1{display:flex;align-items:center;gap:10px}
.wkbar .nm{flex:1;min-width:0}
.wkbar .nm small{display:block;color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkbar .nm b{font-family:'Barlow Condensed';font-size:30px;line-height:1}
.wkbar .fin{padding:10px 16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:800}
.wkbar .more{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;line-height:1}
.prog{height:6px;border-radius:3px;background:var(--card2);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.wkbar .r2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--mut)}
.restchip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:13px}
.restchip em{font-style:normal;color:var(--mut);font-weight:600}
.wk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.wk-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.wk-h .t{cursor:pointer}
.wk-h b{font-size:18px;display:block}
.wk-h small{color:var(--mut);font-size:13px}
.wk-h button{color:var(--mut);font-size:13px;padding:4px 8px;border-radius:8px;background:var(--card2)}
.set,.heads{display:grid;grid-template-columns:32px 1fr 1fr 46px;gap:7px;align-items:center}
.set{margin-bottom:8px}
.heads{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;text-align:center;font-weight:700}
.heads .dbh{color:var(--acc)}
.set .n{font-family:'Barlow Condensed';font-weight:700;color:var(--mut);text-align:center;font-size:20px}
.stp{display:flex;align-items:stretch;background:var(--card2);border:1px solid var(--line);border-radius:12px;height:46px;overflow:hidden;min-width:0}
.stp:focus-within{border-color:var(--acc)}
.stp button{width:30px;flex:none;color:var(--mut);font-size:22px;font-weight:600;line-height:1}
.stp button:active{background:var(--line);color:var(--txt)}
.stp input{flex:1;width:100%;min-width:0;background:none;border:0;outline:0;text-align:center;font-weight:800;font-size:19px;color:var(--txt);padding:0}
.stp input::placeholder{color:#5d636b;font-weight:600;font-size:15px}
.set.done .stp{border-color:rgba(198,244,50,.35);background:rgba(198,244,50,.06)}
.chk{width:46px;height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.chk.ok{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.set.done input{background:#232b14;border-color:#3a4a1a}
.addset{width:100%;padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-weight:600;margin-top:2px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sec2{background:var(--card2);border:1px solid var(--line)}
.btn.ghost{border:1px dashed var(--line);color:var(--acc)}
.btn.danger{color:var(--red)}
.btn+.btn{margin-top:10px}
.empty{text-align:center;padding:28px 18px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);color:var(--mut)}
.empty b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
.linkbtn{margin-top:12px;color:var(--acc);font-weight:700;font-size:14px}

/* descanso flotante */
.rest{position:fixed;left:50%;transform:translateX(-50%) translateY(250%);bottom:calc(92px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 32px));background:#1d2410;border:1px solid var(--acc);border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;transition:transform .3s,visibility .3s;visibility:hidden;pointer-events:none;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.rest.on{transform:translateX(-50%) translateY(0);visibility:visible;pointer-events:auto}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Barlow Condensed';font-size:20px;font-weight:800}
.rest .l{flex:1;min-width:0}
.rest .l b{display:block;font-size:15px}
.rest .l span{font-size:12px;color:var(--mut)}
.rest .bt{display:flex;gap:6px}
.rest .bt button{width:42px;height:42px;border-radius:12px;background:var(--card2);font-weight:800;font-size:13px}
.rest .bt button.sk{background:var(--acc);color:var(--acc-ink);width:auto;padding:0 12px}

/* progreso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center}
.stat b{font-family:'Barlow Condensed';font-size:28px;display:block}
.stat span{font-size:12px;color:var(--mut)}
.week{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.day{text-align:center;font-size:12px;color:var(--mut)}
.day i{display:block;width:30px;height:30px;border-radius:50%;background:var(--card2);margin:6px auto 0}
.day.on i{background:var(--acc)}
.day.today{color:var(--txt);font-weight:700}
.sel{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;margin-bottom:12px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8d939b 50%),linear-gradient(135deg,#8d939b 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.ctitle{font-size:14px;color:var(--mut);margin-bottom:2px}
.cbig{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.cbig b{font-family:'Barlow Condensed';font-size:34px}
.cbig span{font-size:14px;font-weight:700}
.up{color:var(--acc)}.down{color:var(--red)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.ctip{position:absolute;pointer-events:none;background:var(--txt);color:var(--bg);padding:7px 10px;border-radius:10px;font-size:13px;line-height:1.3;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .15s}
.ctip.on{opacity:1}
.cfoot{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:6px;gap:8px;flex-wrap:wrap}
.cfoot b{color:var(--txt)}
.ses{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ses .h{display:flex;justify-content:space-between;gap:10px}
.ses .h b{font-size:17px}
.ses .h span{color:var(--mut);font-size:13px;text-align:right}
.ses ul{list-style:none;margin-top:8px;color:var(--mut);font-size:14px}
.ses li{padding:3px 0}
.ses li em{font-style:normal;color:var(--txt)}

/* perfil */
.pcard{display:flex;gap:14px;align-items:center}
.pav{width:62px;height:62px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:800 30px 'Barlow Condensed'}
.pcard .meta{flex:1;min-width:0}
.pcard .meta b{display:block;font-size:22px;font-family:'Barlow Condensed';text-transform:uppercase}
.pcard .meta span{color:var(--mut);font-size:14px}
.edit{padding:8px 12px;border-radius:10px;background:var(--card2);font-weight:700;font-size:13px}
.goal{margin-bottom:14px}
.goal:last-child{margin-bottom:0}
.goal .gh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.goal .gh span{color:var(--mut)}
.goal .bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.wrow{display:flex;gap:8px}
.wrow input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0;font-weight:700}
.wrow button{padding:0 16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:800}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pav{width:38px;height:38px;font-size:18px}
.prow .pav.off{background:var(--card2);color:var(--txt)}
.prow .meta{flex:1}
.prow .meta b{display:block}
.prow .meta span{color:var(--mut);font-size:13px}
.prow button{padding:8px 12px;border-radius:10px;background:var(--card2);font-weight:700;font-size:13px}
.form label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:14px 0 6px}
.form input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0;font-weight:600}
.form input:focus{border-color:var(--acc)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{padding:9px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.opts button.on{border-color:var(--acc);color:var(--acc);background:#1f2614}

/* hoja */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:41;max-height:90vh;overflow-y:auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet .big{height:120px;border-radius:18px;background:radial-gradient(circle at 30% 30%,#2b3613,var(--card2));display:grid;place-items:center;margin-bottom:14px}
.sheet .big svg{width:64px;height:64px}
.sheet h3{font-size:28px;text-transform:uppercase;line-height:1}
.sheet .sub{color:var(--mut);font-size:14px;margin-top:6px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.tags span{font-size:13px;padding:5px 10px;border-radius:8px;background:var(--card2);color:var(--mut)}
.sheet h4{font-family:'Barlow Condensed';font-size:18px;text-transform:uppercase;color:var(--acc);margin:14px 0 8px}
.sheet ol{list-style:none;counter-reset:s}
.sheet ol li{counter-increment:s;display:flex;gap:10px;margin-bottom:10px;line-height:1.4}
.sheet ol li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700}
.tip{background:var(--card2);border-left:3px solid var(--acc);padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.4;margin-bottom:16px}
.back{color:var(--acc);font-weight:700;font-size:14px;margin-bottom:10px}
.animbox{background:radial-gradient(ellipse at 50% 30%,#1f2717,#121417 75%);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
canvas.anim{display:block;width:100%;height:250px}
.aphase{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.aphase .pn{flex:none;font:800 13px 'Barlow';background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:3px 7px}
.aphase .pl{font-size:17px;line-height:1.2}
.abar{height:3px;background:var(--card2);margin:0 14px}

<script>
/* ================= Iconos por grupo ================= */
const ICON = {
  Pecho:`<svg viewBox="0 0 32 32" fill="none" stroke="#c6f432" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c4-3 8-3 12 0 4-3 8-3 12 0v6c-2 5-7 7-12 5-5 2-10 0-12-5z"/><path d="M16 10v11"/></svg>`,
  Espalda:`<svg viewBox="0 0 32 32" fill="none" stroke="#c6f432" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4v24"/><path d="M8 7c-2 5-2 11 2 17l6 2 6-2c4-6 4-12 2-17"/><path d="M10 12l6 3 6-3"/></svg>`,
  Piernas:`<svg viewBox="0 0 32 32" fill="none" stroke="#c6f432" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l-1 10 2 8-1 8M22 3l1 10-2 8 1 8"/><path d="M9 13h5M18 13h5"/></svg>`,
  Hombros:`<svg viewBox="0 0 32 32" fill="none" stroke="#c6f432" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="7" r="3"/><path d="M5 18c0-5 4-8 11-8s11 3 11 8"/><path d="M8 18v8M24 18v8"/></svg>`,
  Brazos:`<svg viewBox="0 0 32 32" fill="none" stroke="#c6f432" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 26l4-10c1-3 4-5 7-4l3 1c3 1 4 4 3 7"/><path d="M14 9c1-3 4-4 6-2 2 2 1 5-1 6"/></svg>`,
  Core:`<svg viewBox="0 0 32 32" fill="none" stroke="#c6f432" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="4" width="14" height="24" rx="5"/><path d="M16 4v24M9 11h14M9 17h14M9 23h14"/></svg>`
};
const GROUPS = Object.keys(ICON);

/* ================= Biblioteca ================= */
/*RAW*/
const EX = RAW.map(r=>({id:r[0],n:r[1],g:r[2],eq:r[3],l:r[4],m:r[5],s:r[6].split('|'),t:r[7]}));
const byId = Object.fromEntries(EX.map(e=>[e.id,e]));

/* ================= Ranking por músculo ================= */
/*MUS*/
// ejercicio → músculos que trabaja (según los rankings)
const EX2MUS={};Object.entries(MUS).forEach(([k,m])=>m.r.forEach(([id])=>{(EX2MUS[id]=EX2MUS[id]||[]).push(k)}));
const MKEYS=Object.keys(MUS);

/* ================= Datos: perfiles ================= */
const KEY='fuerzaapp-v1';
let DB={profiles:[],active:null,unit:'lb'};
const uid=()=>Math.random().toString(36).slice(2,9);
function newProfile(o){return Object.assign({id:uid(),name:'Mi perfil',sex:'m',weight:'',height:'',goalWeight:'',goal:'musculo',days:3,freq:2,weights:[],history:[],routines:[],workout:null,rest:90,auto:true,created:Date.now(),measures:[],photos:[],age:'',act:'mod',munit:'cm'},o||{})}
try{
  const raw=JSON.parse(localStorage.getItem(KEY)||'null');
  if(raw&&raw.profiles)DB=raw;
  else if(raw&&(raw.history||raw.workout)){ // datos de la versión anterior
    const c=raw.cfg||{};const p=newProfile({sex:c.sex||'m',rest:c.rest||90,auto:c.auto!==false,history:raw.history||[],routines:raw.routines||[],workout:raw.workout||null});
    DB={profiles:[p],active:p.id};
  }
}catch(e){}
// convierte datos antiguos guardados en kg a libras (una sola vez)
(function(){if(DB.unit==='lb'||!DB.profiles.length){DB.unit='lb';return}const c=v=>{const n=parseFloat(v);return isNaN(n)?v:String(Math.round(n*2.20462*2)/2)};
  DB.profiles.forEach(p=>{p.history.forEach(h=>h.items.forEach(it=>it.sets.forEach(st=>st.kg=c(st.kg))));if(p.workout)p.workout.items.forEach(it=>{it.sets.forEach(st=>st.kg=c(st.kg));(it.prev||[]).forEach(st=>st.kg=c(st.kg))});
    p.weights.forEach(w=>w.kg=Math.round(w.kg*22.0462)/10);if(p.weight)p.weight=Math.round(p.weight*22.0462)/10;if(p.goalWeight)p.goalWeight=Math.round(p.goalWeight*22.0462)/10});DB.unit='lb';try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}})();
(function(){let ch=0;const f=st=>{['kg','reps'].forEach(k=>{if(typeof st[k]==='string'&&/,|[^0-9.]/.test(st[k])){st[k]=clean(st[k]);ch=1}})};
  DB.profiles.forEach(p=>{(p.history||[]).forEach(h=>h.items.forEach(it=>it.sets.forEach(f)));if(p.workout)p.workout.items.forEach(it=>{it.sets.forEach(f);(it.prev||[]).forEach(x=>x&&f(x))})});
  if(ch)try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}})();
function save(){DB.updated=Date.now();_heat=null;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}if(typeof cloudSoon==='function')cloudSoon()}
function P(){return DB.profiles.find(p=>p.id===DB.active)||DB.profiles[0]}
const GOALS={musculo:'Ganar músculo',grasa:'Perder grasa',fuerza:'Ganar fuerza',salud:'Salud general'};

/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};

function weekCounts(){
  const ws=weekStart(),c={};
  P().history.filter(h=>h.start>=ws).forEach(h=>{const ms=new Set();h.items.forEach(it=>(EX2MUS[it.id]||[]).forEach(m=>ms.add(m)));ms.forEach(m=>c[m]=(c[m]||0)+1)});
  return c;
}
function sessionsThisWeek(){const ws=weekStart();return P().history.filter(h=>h.start>=ws).length}
function level(m,c){const n=c[m]||0,f=P().freq;return n>=f?2:n>0?1:0}

}

const SINGLE_DB=['cc','rm','gup','pt'];

const dbf=id=>isDB(id)&&!SINGLE_DB.includes(id)?2:1; // dos mancuernas = el doble de volumen
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n};
const clean=v=>String(v==null?'':v).replace(',','.').replace(/[^0-9.]/g,'');

function seriesFor(id){return P().history.slice().reverse().map(h=>{const it=h.items.find(i=>i.id===id);const ws=it?it.sets.filter(s=>!s.w):[];if(!ws.length)return null;const best=ws.reduce((a,b)=>(+b.kg||0)>(+a.kg||0)?b:a,it.sets[0]);return {t:h.start,v:+best.kg||0,reps:+best.reps||0}}).filter(Boolean)}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function chartSVG(d,goal){
  const W=340,H=180,L=34,R=12,T=14,B=26;
  const ks=d.map(p=>p.v).concat(goal?[goal]:[]);let lo=Math.min(...ks),hi=Math.max(...ks);
  if(hi===lo){lo=Math.max(0,lo-5);hi=hi+5}const pad=(hi-lo)*.15;lo=Math.max(0,lo-pad);hi=hi+pad;
  const step=niceStep((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=i=>d.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(d.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2e33"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" fill="#8d939b" font-size="11">${+v.toFixed(1)}</text>`;
  if(goal)g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#8d939b" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end" fill="#8d939b" font-size="11">Meta ${goal}</text>`;
  const li=d.length<=6?d.map((_,i)=>i):[0,Math.floor((d.length-1)/2),d.length-1];
  const xl=li.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" fill="#8d939b" font-size="11">${dstr(d[i].t)}</text>`).join('');
  const line=d.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.v).toFixed(1)).join('');
  const area=d.length>1?`<path d="${line}L${x(d.length-1)},${H-B}L${x(0)},${H-B}Z" fill="url(#ga)"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6f432" stop-opacity=".22"/><stop offset="1" stop-color="#c6f432" stop-opacity="0"/></linearGradient></defs>${g}${xl}${area}<path d="${line}" fill="none" stroke="#c6f432" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${d.map((p,i)=>`<circle class="dot" data-di="${i}" cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#c6f432" stroke="#17191c" stroke-width="2"/>`).join('')}${d.map((p,i)=>`<circle data-pi="${i}" cx="${x(i)}" cy="${y(p.v)}" r="16" fill="transparent" style="cursor:pointer"/>`).join('')}</svg>`;
}
function bindChart(box,d,tipFn){
  const tip=box.querySelector('.ctip');
  box.querySelectorAll('[data-pi]').forEach(c=>{const show=()=>{const i=c.dataset.pi;box.querySelectorAll('.dot').forEach(x=>x.setAttribute('r',4));box.querySelector(`.dot[data-di="${i}"]`).setAttribute('r',6);
    const svg=box.querySelector('svg'),w=svg.getBoundingClientRect().width,sc=w/340;tip.innerHTML=tipFn(d[i]);tip.style.left=Math.min(Math.max(+c.getAttribute('cx')*sc,75),w-75)+'px';tip.style.top=(+c.getAttribute('cy')*sc)+'px';tip.classList.add('on')};
    c.onpointerenter=show;c.onclick=show});
  box.onpointerleave=()=>{tip.classList.remove('on');box.querySelectorAll('.dot').forEach(x=>x.setAttribute('r',4))};
}
function renderChart(){
  const ids=[...new Set(P().history.flatMap(h=>h.items.map(i=>i.id)))].filter(id=>byId[id]);const A=$('#chartArea');
  if(!ids.length){A.innerHTML=`<div class="empty"><b>Aún no hay datos</b>Termina un entreno y aquí verás cómo sube tu peso en cada ejercicio.<br><button class="linkbtn" id="demo">Cargar datos de ejemplo</button></div>`;$('#demo').onclick=loadDemo;return}
  if(!chartEx||!ids.includes(chartEx))chartEx=ids[0];
  const d=seriesFor(chartEx),first=d[0],last=d[d.length-1],diff=last.v-first.v,rec=Math.max(...d.map(p=>p.v));
  A.innerHTML=`<div class="card"><select class="sel" id="exSel">${ids.map(id=>`<option value="${id}" ${id===chartEx?'selected':''}>${byId[id].n}</option>`).join('')}</select>
    <div class="ctitle">Peso máximo por sesión</div>
    <div class="cbig"><b>${last.v} lb</b>${d.length>1?`<span class="${diff>=0?'up':'down'}">${diff>=0?'▲ +':'▼ '}${+diff.toFixed(1)} lb desde el inicio</span>`:''}</div>
    <div class="chartbox" id="cbox">${chartSVG(d)}<div class="ctip"></div></div>
    <div class="cfoot"><span>Récord: <b>${rec} lb</b></span><span>1RM estimado: <b>${Math.round(e1rm(last.v,last.reps))} lb</b></span><span>${d.length} sesiones</span></div></div>`;
  $('#exSel').onchange=e=>{chartEx=e.target.value;renderChart()};
  bindChart($('#cbox'),d,p=>`<b>${p.v} lb × ${p.reps}</b><br>${dstr(p.t)} · 1RM ≈ ${Math.round(e1rm(p.v,p.reps))} lb`);
}
function loadDemo(){
  const day=864e5,base=Date.now()-27*day,p=P();const plan=[['pb',110,5,8],['sq',135,10,8],['pmr',115,10,10],['jp',90,5,10],['el',15,2.5,12]];
  for(let k=0;k<9;k++){const t=base+k*3*day;const h={name:k%2?'Pierna':'Torso',start:t,end:t+55*6e4,items:[]};
    plan.forEach(([id,kg,inc,r],j)=>{if((j%2)===(k%2)||id==='pb'||id==='sq'){const w=kg+Math.floor(k*.8)*inc;h.items.push({id,sets:[{kg:String(w-inc),reps:String(r)},{kg:String(w),reps:String(r)},{kg:String(w),reps:String(r-1)}]})}});
    p.history.push(h)}
  // dos entrenos esta semana para ver colores y avisos
  const ws=weekStart(),td=Date.now();
  const t1=Math.min(ws+3600e3*18,td-3600e3);p.history.push({name:'Torso',start:t1,end:t1+50*6e4,items:[{id:'pb',sets:[{kg:'145',reps:'8'},{kg:'145',reps:'7'}]},{id:'dm',sets:[{kg:'0',reps:'8'},{kg:'0',reps:'7'}]},{id:'pmm',sets:[{kg:'40',reps:'10'}]},{id:'cc',sets:[{kg:'25',reps:'12'}]}]});
  p.history.sort((a,b)=>b.start-a.start);
  if(!p.weights.length){const w0=+p.weight||175;for(let k=0;k<6;k++)p.weights.push({t:base+k*5*day,kg:+(w0+3-k*.6).toFixed(1)})}
  save();chartEx='pb';renderHist();updateBell();toast('Datos de ejemplo cargados');
}
